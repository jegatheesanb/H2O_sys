<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - H2O Management System</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background: linear-gradient(135deg, #00c6fb 0%, #005bea 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .navbar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .navbar .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .navbar .logo i {
            font-size: 30px;
            color: #0077b6;
        }

        .navbar .logo h1 {
            color: #0077b6;
            font-size: 24px;
            font-weight: 600;
        }

        .navbar .user-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .navbar .user-info span {
            color: #333;
            font-weight: 500;
        }

        .btn-logout {
            padding: 10px 20px;
            background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-logout:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 75, 43, 0.3);
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .card-header i {
            font-size: 35px;
            color: #0077b6;
        }

        .card-header h3 {
            color: #666;
            font-size: 14px;
            font-weight: 500;
        }

        .card-value {
            font-size: 32px;
            font-weight: 700;
            color: #0077b6;
        }

        .card-value small {
            font-size: 14px;
            color: #999;
            font-weight: 400;
        }

        .card.blue { border-left: 4px solid #0077b6; }
        .card.cyan { border-left: 4px solid #00b4d8; }
        .card.teal { border-left: 4px solid #06d6a0; }
        .card.orange { border-left: 4px solid #ffd166; }

        .content-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }

        @media (max-width: 900px) {
            .content-grid {
                grid-template-columns: 1fr;
            }
        }

        .form-section, .table-section {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .section-title {
            color: #0077b6;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #0077b6;
            box-shadow: 0 0 0 4px rgba(0, 119, 182, 0.1);
        }

        .btn-submit {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #0077b6 0%, #00b4d8 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 119, 182, 0.3);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        thead {
            background: linear-gradient(135deg, #0077b6 0%, #00b4d8 100%);
            color: white;
        }

        th, td {
            padding: 15px;
            text-align: left;
        }

        th {
            font-weight: 600;
            font-size: 14px;
        }

        tbody tr {
            border-bottom: 1px solid #e0e0e0;
            transition: all 0.3s ease;
        }

        tbody tr:hover {
            background: #f8f9fa;
        }

        .badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            background: #06d6a0;
            color: white;
        }

        .water-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo">
            <i class="fas fa-tint"></i>
            <h1>H2O Management</h1>
        </div>
        <div class="user-info">
            <span id="userName">Welcome</span>
            <button class="btn-logout" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </div>

    <div class="dashboard">
        <div class="card blue">
            <div class="card-header">
                <i class="fas fa-history"></i>
                <h3>Usage Till Last Month</h3>
            </div>
            <div class="card-value" id="lastMonth">0 <small>Liters</small></div>
        </div>

        <div class="card cyan">
            <div class="card-header">
                <i class="fas fa-tint"></i>
                <h3>This Month Usage</h3>
            </div>
            <div class="card-value" id="thisMonth">0 <small>Liters</small></div>
        </div>

        <div class="card teal">
            <div class="card-header">
                <i class="fas fa-chart-line"></i>
                <h3>Total Usage</h3>
            </div>
            <div class="card-value" id="totalUsage">0 <small>Liters</small></div>
        </div>

        <div class="card orange">
            <div class="card-header">
                <i class="fas fa-receipt"></i>
                <h3>Current Bill</h3>
            </div>
            <div class="card-value" id="bill">₹0 <small>INR</small></div>
        </div>
    </div>

    <div class="content-grid">
        <div class="form-section">
            <h2 class="section-title">
                <i class="fas fa-plus-circle"></i>
                Add Monthly Usage
            </h2>
            <form id="usageForm">
                <div class="form-group">
                    <label for="month">Month</label>
                    <select id="month" required>
                        <option value="">Select Month</option>
                        <option value="January">January</option>
                        <option value="February">February</option>
                        <option value="March">March</option>
                        <option value="April">April</option>
                        <option value="May">May</option>
                        <option value="June">June</option>
                        <option value="July">July</option>
                        <option value="August">August</option>
                        <option value="September">September</option>
                        <option value="October">October</option>
                        <option value="November">November</option>
                        <option value="December">December</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="year">Year</label>
                    <input type="number" id="year" placeholder="2026" min="2020" max="2099" required>
                </div>

                <div class="form-group">
                    <label for="liters">Water Usage (Liters)</label>
                    <input type="number" id="liters" placeholder="Enter liters" min="0" required>
                </div>

                <button type="submit" class="btn-submit">
                    <i class="fas fa-save"></i> Add Usage
                </button>
            </form>
        </div>

        <div class="table-section">
            <h2 class="section-title">
                <i class="fas fa-table"></i>
                Usage History
            </h2>
            <table>
                <thead>
                    <tr>
                        <th>Month</th>
                        <th>Year</th>
                        <th>Usage (Liters)</th>
                        <th>Bill (₹)</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="historyTable">
                    <!-- Data will be loaded here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const userId = localStorage.getItem('userId');

        async function loadDashboard() {
            if(!userId) { window.location.href = 'login.html'; return; }
            
            const res = await fetch(`/api/dashboard/${userId}`);
            const data = await res.json();

            document.getElementById('lastMonth').innerHTML = `${data.usageUptoLastMonth.toLocaleString()} <small>Liters</small>`;
            document.getElementById('thisMonth').innerHTML = `${data.thisMonthUsage.toLocaleString()} <small>Liters</small>`;
            document.getElementById('totalUsage').innerHTML = `${data.totalUsage.toLocaleString()} <small>Liters</small>`;
            document.getElementById('bill').innerHTML = `₹${data.currentBill.toLocaleString()} <small>INR</small>`;

            const tbody = document.getElementById('historyTable');
            tbody.innerHTML = '';
            data.history.forEach(record => {
                tbody.innerHTML += `
                    <tr>
                        <td>${record.month}</td>
                        <td>${record.year}</td>
                        <td>${record.usage_liters.toLocaleString()} L</td>
                        <td>₹${record.bill_amount.toLocaleString()}</td>
                        <td><span class="badge">Paid</span></td>
                    </tr>
                `;
            });
        }

        document.getElementById('usageForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                user_id: userId,
                month: document.getElementById('month').value,
                year: document.getElementById('year').value,
                usage_liters: document.getElementById('liters').value
            };
            await fetch('/api/usage', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            alert('Usage added successfully!');
            loadDashboard();
            e.target.reset();
        });

        function logout() {
            localStorage.removeItem('userId');
            window.location.href = 'login.html';
        }

        // Set current year
        document.getElementById('year').value = new Date().getFullYear();

        loadDashboard();
    </script>
</body>
</html>
